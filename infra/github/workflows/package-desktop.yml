name: Build Windows desktop package

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'package.json'
      - 'package-lock.json'
      - 'infra/github/workflows/package-desktop.yml'

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Package Windows executable
        run: npm run desktop:package:win

      - name: Upload Windows portable build
        uses: actions/upload-artifact@v4
        with:
          name: gluely-copilot-win-portable
          path: apps/desktop/dist/*.exe
          if-no-files-found: error
